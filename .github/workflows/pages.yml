name: Deploy to GitHub Pages

# Builds the site (one HTML file per page, sitemap, share images) and publishes it.
# Bikes, prices and stock come from the Cycle Beast feed, so the site also rebuilds
# every hour, and Cycle Beast can ask for an immediate rebuild (see README).
on:
  push:
  workflow_dispatch:
  schedule:
    - cron: "23 * * * *"
  repository_dispatch:
    types: [cycle-beast-updated]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # Scheduled and dispatched runs always use the default branch; pushes only deploy from it
    if: github.event_name == 'schedule' || github.event_name == 'repository_dispatch' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - id: pages
        uses: actions/configure-pages@v5
      # Resized product photos and each page's last-changed date, kept between runs so hourly
      # builds only download new photos and the sitemap's dates stay accurate
      - name: Restore build cache
        uses: actions/cache/restore@v4
        with:
          path: .cache
          key: site-cache-${{ github.run_id }}
          restore-keys: site-cache-
      - name: Build site
        run: npm run build
        env:
          # The live address: https://cyclecentral.ph once the custom domain is active,
          # otherwise https://<user>.github.io with base path /cycle_central
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # Cycle Beast feed key (Settings → Secrets and variables → Actions → CATALOG_FEED_KEY).
          # Without it the placeholder bikes are used. If it's set and the feed can't be read,
          # the build stops and the site that's already live stays up.
          CATALOG_FEED_KEY: ${{ secrets.CATALOG_FEED_KEY }}
          CATALOG_FEED_URL: ${{ vars.CATALOG_FEED_URL }}
      - name: Save build cache
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .cache
          key: site-cache-${{ hashFiles('.cache/seo-state.json', '.cache/img/*.json') }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
      # Tell Bing (and ChatGPT search, Copilot, Yandex) which pages changed; never fails the deploy
      - name: Notify search engines (IndexNow)
        continue-on-error: true
        run: node scripts/indexnow.mjs
